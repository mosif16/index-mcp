[package]
name = "index-mcp-server"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Rust MCP server that indexes workspaces into SQLite for semantic search."
readme = "README.md"
repository = "https://github.com/mosif16/index-mcp"
keywords = ["mcp", "indexing", "search", "sqlite"]
categories = ["command-line-utilities", "development-tools::build-helpers"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
rmcp = { workspace = true, features = ["server", "client", "transport-io", "transport-sse-client-reqwest"] }
rmcp-macros = { workspace = true }
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
async-trait = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
fastembed = { workspace = true }
regex = { workspace = true }
swc_common = { workspace = true }
swc_ecma_parser = { workspace = true }
swc_ecma_visit = { workspace = true }
swc_ecma_ast = { workspace = true }
once_cell = { workspace = true }
url = { workspace = true }
notify = { workspace = true }
reqwest = { workspace = true }
ignore = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
sentence-transformers-rs = { workspace = true }
hnsw_rs = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
